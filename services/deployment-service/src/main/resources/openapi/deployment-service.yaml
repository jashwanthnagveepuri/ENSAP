openapi: 3.0.3
info:
  title: ENSAP Deployment Service
  version: "0.2.0"
  description: >
    Owns deployment/batch/step lifecycle and idempotency
    (docs/06-component-design.md, master spec §7.2/§12). Phase 2: a
    deployment can be created (idempotently) and tracked through a basic
    Camunda 8 workflow (workflow/camunda/deployment-process.bpmn). Provider
    job workers are Phase 4 — a deployment may sit at its first workflow
    step until then.
servers:
  - url: http://localhost:8082

paths:
  /api/deployments:
    get:
      summary: List/search deployments
      operationId: listDeployments
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DeploymentStatus' }
        - name: siteId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Page of deployments
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: { $ref: '#/components/schemas/Deployment' }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer }
    post:
      summary: Start a deployment (idempotent)
      operationId: createDeployment
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Replaying the same key returns the original deployment
            (200) instead of creating a duplicate (master spec §12).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDeploymentRequest' }
      responses:
        '201':
          description: Deployment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '200':
          description: Repeated request with the same Idempotency-Key — returns the original deployment, no duplicate created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '400':
          $ref: '#/components/responses/Error'

  /api/deployments/{deploymentId}:
    get:
      summary: Get a deployment
      operationId: getDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '200':
          description: Deployment details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '404':
          $ref: '#/components/responses/Error'

  /api/deployments/{deploymentId}/retry:
    post:
      summary: Manually retry a failed deployment (docs/08-workflow.md — FAILED / FAILED_REQUIRES_ATTENTION)
      operationId: retryDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Deployment is not in a retryable state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /api/deployments/{deploymentId}/cancel:
    post:
      summary: Cancel a deployment
      operationId: cancelDeployment
      parameters:
        - $ref: '#/components/parameters/DeploymentId'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deployment' }
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Deployment is already in a terminal state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

components:
  parameters:
    DeploymentId:
      name: deploymentId
      in: path
      required: true
      schema: { type: string }

  schemas:
    DeploymentStatus:
      type: string
      enum: [REQUESTED, RUNNING, COMPLETED, FAILED, FAILED_REQUIRES_ATTENTION, CANCELLED]

    CreateDeploymentRequest:
      type: object
      required: [siteId]
      properties:
        siteId: { type: string }
        requestedBy: { type: string }

    DeploymentStep:
      type: object
      properties:
        id: { type: string }
        stepName: { type: string }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED] }
        attemptCount: { type: integer }
        lastError: { type: string, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    Deployment:
      type: object
      properties:
        id: { type: string }
        siteId: { type: string }
        batchId: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/DeploymentStatus' }
        workflowInstanceId: { type: string, nullable: true }
        requestedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        steps:
          type: array
          items: { $ref: '#/components/schemas/DeploymentStep' }

    ApiError:
      type: object
      description: docs/10-api-design.md error model
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
