spring:
  application:
    name: evidence-audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ensap}
    username: ${SPRING_DATASOURCE_USERNAME:ensap}
    password: ${SPRING_DATASOURCE_PASSWORD:ensap_dev_only}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by Liquibase (docs/09-database-design.md)
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: evidence-audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
