spring:
  application:
    name: site-profile-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ensap}
    username: ${SPRING_DATASOURCE_USERNAME:ensap}
    password: ${SPRING_DATASOURCE_PASSWORD:ensap_dev_only}
  jpa:
    hibernate:
      ddl-auto: none   # schema is owned by Liquibase (docs/09-database-design.md)
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8080

# Phase 1 mock "source of truth" systems the refresh flow reconciles
# against (master spec §22, mocks/location-service|inventory-service|network-service).
site-profile:
  source-systems:
    location-url: ${LOCATION_SERVICE_URL:http://localhost:8091}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8092}
    network-url: ${NETWORK_SERVICE_URL:http://localhost:8093}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
