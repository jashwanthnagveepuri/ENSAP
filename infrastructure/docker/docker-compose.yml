# ENSAP local Docker Compose skeleton (see docs/14-deployment.md).
#
# Live today: postgres, redis, kafka, zeebe, operate; site-profile-service
# (Phase 1: real site/device/network-profile CRUD+search+refresh, see its
# README) plus the three Phase 1 mock source systems it reconciles against
# on refresh (location-service, inventory-service, network-service); and
# deployment-service/evidence-audit-service, still Phase 0 501-stub shells.
#
# Commented out below: provider mocks (router/switch/wireless/firewall/
# ticketing), workers/*, and frontend — Phase 4/1 respectively.
#
# No AWS credentials are required to run any of this (master spec §2.3).
#
# Usage:
#   docker compose up -d postgres redis kafka zeebe operate
#   docker compose up -d --build location-service inventory-service network-service
#   docker compose up -d --build site-profile-service deployment-service evidence-audit-service

name: ensap

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ensap
      POSTGRES_PASSWORD: ensap_dev_only   # local-only placeholder, never a real secret (docs/12-security.md)
      POSTGRES_DB: ensap
    ports:
      - "5432:5432"
    volumes:
      - ensap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ensap -d ensap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-broker Kafka in KRaft mode (no Zookeeper needed).
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ENSAPKRaftClusterId01

  # Camunda 8 workflow engine (Zeebe broker) — hosts workflow/camunda/deployment-process.bpmn.
  zeebe:
    image: camunda/zeebe:8.5.9
    ports:
      - "26500:26500"  # gateway (gRPC)
      - "9600:9600"    # monitoring/health
    environment:
      ZEEBE_BROKER_GATEWAY_ENABLE: "true"

  # Camunda Operate — web UI to inspect running/completed process instances.
  operate:
    image: camunda/operate:8.5.9
    ports:
      - "8081:8080"
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
    depends_on:
      - zeebe

  location-service:
    build:
      context: ../../mocks/location-service
    ports:
      - "8091:8080"

  inventory-service:
    build:
      context: ../../mocks/inventory-service
    ports:
      - "8092:8080"

  network-service:
    build:
      context: ../../mocks/network-service
    ports:
      - "8093:8080"

  site-profile-service:
    build:
      context: ../../services/site-profile-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ensap
      SPRING_DATASOURCE_USERNAME: ensap
      SPRING_DATASOURCE_PASSWORD: ensap_dev_only
      SPRING_DATA_REDIS_HOST: redis
      LOCATION_SERVICE_URL: http://location-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      NETWORK_SERVICE_URL: http://network-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  deployment-service:
    build:
      context: ../../services/deployment-service
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ensap
      SPRING_DATASOURCE_USERNAME: ensap
      SPRING_DATASOURCE_PASSWORD: ensap_dev_only
    depends_on:
      postgres:
        condition: service_healthy

  evidence-audit-service:
    build:
      context: ../../services/evidence-audit-service
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ensap
      SPRING_DATASOURCE_USERNAME: ensap
      SPRING_DATASOURCE_PASSWORD: ensap_dev_only
    depends_on:
      postgres:
        condition: service_healthy

  # --- Not yet built (Phase 1: frontend; Phase 4: provider mocks/workers) --
  #
  # frontend:
  #   build:
  #     context: ../../frontend
  #   ports:
  #     - "5173:80"
  #
  # router-provider / switch-provider / wireless-provider / firewall-provider
  # / ticketing-provider (mocks/*): each a tiny HTTP mock with a
  #   configurable-behavior admin endpoint (docs/06-component-design.md,
  #   master spec §22) — added in Phase 4. location-service/inventory-service/
  #   network-service (the Phase 1 source-of-truth mocks) are live above.
  #
  # router-worker / switch-worker / wireless-worker / firewall-worker /
  # ticketing-worker (workers/*):
  #   Zeebe job workers + Kafka producers — added in Phase 4.

volumes:
  ensap_postgres_data:
